# LCOE observations. One row = one (technology, vintage, report) observation.
# Uniqueness: (technology, year_vintage, report_name, subsidized, geography) must not repeat.
# If you load two observations of the same tech-year from different reports (e.g. Lazard + BNEF),
# use distinct report_name values — both will load and analyze.py will show them side-by-side.

rows:
  # ---- Wind — Onshore (standalone) ----
