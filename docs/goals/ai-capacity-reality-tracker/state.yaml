  - id: T006
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: Implement a read-only campus evidence coverage/gap report that ranks unenergized campus MW and shows whether each campus has enough independent evidence groups to support confidence scoring.
    allowed_files:
      - scripts/evidence_coverage.py
    verify:
      - .venv/bin/python scripts/evidence_coverage.py --top 15
    stop_if:
      - Need network access, paid data, browser automation, or credentials.
      - Need to edit data rows or schema instead of a read-only reporting script.
      - Need files outside allowed_files.
      - The script cannot distinguish capacity_definition from evidence capacity_definition safely.
    receipt:
      result: done
      changed_files:
        - scripts/evidence_coverage.py
      commands:
        - cmd: .venv/bin/python scripts/evidence_coverage.py --top 15
          status: pass
          notes: Reported 86 campuses, 50,724 planned MW, 7,094 energized MW, 46,336 unenergized planned MW, and 0 current campus_evidence rows.
      summary: Added a read-only evidence coverage report ranking unenergized campus MW gaps and showing independent evidence group counts/gate status per campus.
  - id: T007
    type: worker
    assignee: Worker
    status: done
    reasoning_hint: medium
    objective: Populate the first source-backed campus_evidence slice for the highest-impact US campuses, prioritizing public utility/regulator, local permit/site-plan, air-permit, corporate-activation, and EIA/source cross-check evidence. Keep each row tied to one source_id and preserve MW basis explicitly.
    allowed_files:
      - data/campus_evidence.yaml
      - data/sources.yaml
    verify:
      - .venv/bin/python scripts/load.py
      - .venv/bin/python scripts/validate.py
      - .venv/bin/python scripts/evidence_coverage.py --top 15
    stop_if:
      - Need paid or non-public data access.
      - Need files outside allowed_files.
      - Evidence cannot be tied to a source ID or source-backed note.
      - Potential double-counting or MW-basis conflict cannot be resolved locally.
      - A public source only supports an announcement and gives no independent capacity/deliverability signal; tag it as announced evidence or skip.
    receipt:
      result: done
      changed_files:
        - data/campus_evidence.yaml
        - data/sources.yaml
