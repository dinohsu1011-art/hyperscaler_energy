active_task: T040
tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: Map the current repo data model and identify exactly what it already captures or misses for announced-vs-real capacity assessment.
    inputs:
      - README.md
      - schema.sql
      - data/contracts/*.yaml
      - data/campuses.yaml
      - data/sources.yaml
      - scripts/load.py
      - scripts/validate.py
      - scripts/dashboard.py
    constraints:
      - Read-only.
      - Do not edit implementation or data files.
      - Separate direct capacity evidence from market proxy evidence.
      - Identify double-counting risks between contracts, campuses, tenants, operators, and energy supply.
    expected_output:
      - Current data map
      - Fields already present that answer real capacity vs announcements
      - Missing fields/tables needed for phase-level evidence and confidence scoring
      - Top repo-native files likely needed for first Worker slice
    receipt:
      result: done
      summary: 'Mapped the repo data model for announced-vs-real capacity: the project already tracks energy contracts, campus planned/phase/energized MW, EIA planned/operating generator vintages, source provenance, and cost/demand side datasets, but lacks structured evidence routes and confidence gates for actual online capacity.'
      evidence:
        - 'schema.sql: sources, hyperscaler_contracts, data_center_campuses, planned_generators, operating_generators, provenance and EIA views'
        - 'scripts/load.py: loaders for contracts, campuses, EIA 860M history, and supporting cost/demand datasets'
        - 'scripts/validate.py: orphan-source, invalid-url, provenance, duplicate-smell, and known aggregate double-count checks'
        - 'data.db snapshot: 354 sources, 208 contracts, 86 campuses, 24,591 planned generator rows, 27,837 operating generator rows'
        - 'campus status snapshot: 50.7 GW planned vs 7.1 GW energized, with most planned MW still Announced/UnderConstruction/PartiallyEnergized'
      findings:
        - 'Existing direct capacity fields are campus-level only: planned MW, phase-one MW, energized MW, capacity definition, status, dates, notes, and one source_id.'
        - The database has no structured phase/building table, no evidence_type/source_strength/evidence_date fields, no utility service/interconnection/substation/permit fields, and no claim-level evidence matrix.
        - The validator catches some duplicate smells but does not reconcile campuses vs contracts vs tenant/operator vs energy-supply deals, nor facility-power vs critical-IT definitions.
        - Market proxy signals proposed by the user are not yet represented as structured tables.
      next: Inventory direct capacity evidence routes and rank the first-pass collection targets before changing schema or collectors.
  - id: T002
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: Inventory direct capacity evidence routes for top planned MW campuses and operators.
    inputs:
      - T001 receipt
      - Current campus and contract rows
      - 'User requirement: 90% confidence using evidence matrix'
    constraints:
      - Read-only.
      - Prioritize utility filings, customer-specific tariffs, service agreements, interconnection approvals, substation/transmission evidence, backup-generator air permits, building/electrical permits, certificates of occupancy, and satellite/construction evidence.
      - For each route, classify source availability, update frequency, programmatic collectability, and evidence strength.
      - Do not browse or collect every source exhaustively unless /goal activates this task; this prep board only defines the task.
    expected_output:
      - Ranked direct-evidence source inventory
      - Top campuses/operators needing first-pass evidence collection
      - Not-publicly-knowable candidates and the evidence routes that would need to fail before that verdict
      - Suggested first data-slice scope
    receipt:
      result: done
      summary: Ranked public direct-capacity evidence routes. Cleanest route is utility/regulator service evidence, followed by local site/building/COO evidence, backup/onsite generation air permits, transmission/substation evidence, EIA 860M power-supply cross-checks, and satellite construction monitoring. Biggest gaps are concentrated in a short list of 1 GW-plus rows where planned MW is high but energized MW is zero or partial.
      evidence:
        - 'Local DB top unenergized campus gaps: Hyperion 5.0 GW, Stargate UAE 5.0 GW, Microsoft Permian 2.5 GW, Amazon NIPSCO Phase 2 2.4 GW, Cumulus 1.62 GW, Prometheus 1.5 GW, Stargate Frontier/Michigan 1.4 GW each, Monarch 1.35 GW.'
        - 'EIA 860M is monthly and tracks existing/proposed generators >=1 MW, but EIA warns capacities are preliminary and not capacity commitments: https://www.eia.gov/electricity/data/eia860m/'
        - 'Michigan MPSC exposes E-Dockets/current filings/open cases and Google committed to a contested case for DTE utility contracts: https://www.michigan.gov/mpsc/commission/case-hearing-info and https://www.michigan.gov/ag/news/press-releases/2026/03/17/ag-nessel-on-newly-announced-google-data-center-proposal'
        - 'Indiana IURC Online Services Portal exposes docketed case documents from 2001-present; useful for NIPSCO/Amazon and AES/Google service evidence: https://www.in.gov/iurc/online-services'
        - 'Virginia DEQ publishes issued air permits for data centers and includes Microsoft Mecklenburg/LVL/Timber/AVC rows, a strong backup-generation evidence route: https://www.deq.virginia.gov/news-info/shortcuts/permits/air/issued-air-permits-for-data-centers'
        - 'Amazon primary announcement states Northern Indiana adds 2.4 GW data center capacity and up to 3.0 GW new capacity via NIPSCO GenCo, giving a target for regulator/utility verification: https://www.aboutamazon.com/news/company-news/amazon-15-billion-indiana-data-centers'
        - Sentinel Hub provides Catalog/Process/Statistical APIs for geospatial monitoring; USGS NAIP is accessible via EarthExplorer for aerial baseline checks.
      ranked_direct_evidence_source_inventory:
        - '1 utility service agreements, special contracts, tariffs, and commission orders: strongest direct evidence for contracted load/phase ramp; event-driven; public but sometimes redacted; collectability mixed by state portal.'
        - '2 local site plans, building/electrical permits, inspections, and certificates of occupancy: strongest construction/activation evidence below utility service; event-driven; highly fragmented; often manual or portal-specific.'
        - '3 backup generator and onsite gas/fuel-cell air permits: strong lower-bound proxy for campus scale and readiness; state/local air agencies; often public PDFs/tables; not equivalent to IT load.'
        - '4 transmission/substation/interconnection evidence: strong evidence for deliverability and phase readiness; sources include PUC siting dockets, utility transmission plans, RTO queues, county plans; often names substations not tenants.'
        - '5 EIA 860M and state generator inventories: excellent monthly supply-side cross-check for new generation supporting campuses; already partly imported; weak for campus load and behind-the-meter attribution.'
        - '6 satellite/aerial construction monitoring: strong physical-progress evidence, programmatic with Sentinel/NAIP/Planet; cannot prove energization by itself; needs coordinates/polygons and phase labels.'
        - '7 corporate go-live announcements and investor decks: useful when they explicitly say activated/live/commissioned; weak when they only state planned investment or future MW.'
        - '8 water/wastewater agreements and economic-development/tax-abatement records: useful corroboration for site scale/timeline; medium-to-weak for actual MW.'
      top_campuses_for_first_pass:
        - 'C027 Meta Hyperion LA: 5.0 GW gap; target LPSC/Entergy service + transmission + generator dockets, Richland Parish permits, satellite.'
        - 'C060 Amazon Northern Indiana Phase 2 and C059 Project Rainier IN: 2.4 GW and 1.2 GW gaps; target IURC/NIPSCO GenCo, St Joseph/local permits, substation/transmission, Amazon activation evidence.'
        - 'C051 Stargate Michigan and C018 Google Cannoli MI: 1.4 GW and 1.0 GW gaps; target MPSC/DTE special contracts, township site-plan approvals, air permits, water/utility agreements.'
        - 'C011 Microsoft Permian TX: 2.5 GW gap but site TBD; keep as high-priority once site/docket appears; for now classify as announcement-only.'
        - 'C055 Cumulus/Susquehanna PA: 1.62 GW gap; target FERC/PJM/Talen interconnection and NRC/power-service evidence.'
        - 'C028 Meta Prometheus OH: 1.5 GW gap; target PUCO/AEP/local permits and satellite.'
        - 'C047/C050/C044 Stargate Texas sites: 1.4/1.2/1.0 GW gaps; target county permits, ERCOT/interconnection/substation evidence, air permits, satellite.'
        - 'C007 Monarch WV and C062 Amazon Mattameade VA: 1.35/1.22 GW gaps; target off-grid generation permits and Virginia DEQ/local building permits respectively.'
      not_publicly_knowable_candidates:
        - Site-TBD announcements such as Microsoft Permian and Amazon Northern Indiana Phase 2 remain announcement-only until utility/site/permit records identify locations or contract phases.
        - Operational campus MW for Google Council Bluffs/Pryor/Storey/The Dalles and Microsoft NoVA is often undisclosed; can be bounded by utility/permit/satellite evidence but not proven exactly without redacted contract terms or FOIA success.
        - Redacted special contracts may prove contracted demand exists without revealing commercial/ramp details; classify missing ramp terms as not-public unless docket or appeal reveals them.
        - GPU counts, cluster utilization, and tenant-specific energization dates are often private; direct capacity matrix should avoid treating them as known unless the operator states activation explicitly.
      suggested_first_data_slice: 'Create a normalized campus_evidence matrix for 12-15 highest unenergized US campuses, collecting at least two evidence types per campus where public: utility/regulator service record plus one of local site/COO, air permit, substation/transmission, EIA generator, or satellite milestone. Exclude or explicitly tag international/site-TBD rows until a public route exists.'
      next: T003 should inventory clean market-proxy datasets, then T004 should choose the first schema/collector slice with allowed_files and verification commands.
  - id: T003
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: medium
    objective: Inventory supporting market-proxy datasets that triangulate whether capacity is actually being absorbed.
    inputs:
      - Preliminary signal ranking from intake
      - SEC EDGAR/XBRL and public API availability
    constraints:
      - Read-only.
      - Prioritize clean, programmatic public datasets over paid/channel-check sources.
      - Treat HBM/CoWoS allocation rumors as optional low-confidence overlays, not core proof.
      - Map each signal to what capacity claim it can and cannot validate.
    expected_output:
      - Ranked market-proxy dataset inventory
      - Fields and source URLs/APIs for capex/depreciation/PP&E/leases, server inventory/backlog/receivables, Nvidia/AMD commitments/customer concentration, GPU rental price/availability, ASIC/networking inference proxies, TSMC monthly/HPC mix
      - Caveats and confidence tags
      - Suggested collector backlog
    receipt:
      result: done
      summary: Ranked supporting market-proxy datasets for capacity absorption. Best public proxy is SEC/XBRL accounting data for hyperscaler capex/PP&E/depreciation/leases, followed by server-vendor inventory/backlog/receivables, chip-vendor customer concentration/customer advances/purchase obligations/segment revenue, GPU rental price/availability snapshots, AI networking/custom ASIC revenue, and TSMC monthly/HPC mix. HBM and CoWoS remain mostly paid/channel-check overlays and should not be core proof.
      evidence:
        - 'SEC EDGAR APIs provide real-time submissions and XBRL companyfacts/companyconcept data without API keys, plus nightly bulk companyfacts/submissions ZIP files: https://www.sec.gov/edgar/sec-api-documentation'
        - 'Dell FY2026 10-K filing page provides HTML/XBRL/PDF; filing text disaggregates AI-optimized servers and discusses AI-driven backlog growth: https://investors.delltechnologies.com/sec-filings/sec-filing/10-k/0001571996-26-000008'
        - 'Supermicro Q3 FY2026 official release includes preliminary balance sheet with inventories, receivables, deferred revenue, and a caveat that results remain subject to closing/review: https://ir.supermicro.com/news/news-details/2026/Supermicro-Announces-Third-Quarter-Fiscal-Year-2026-Financial-Results/default.aspx'
        - 'HPE Q1 FY2026 official results show Cloud & AI/server/networking segment disclosures, order growth, and public earnings materials/transcripts: https://www.hpe.com/us/en/newsroom/press-release/2026/03/hpe-reports-fiscal-2026-first-quarter-results.html'
        - 'NVIDIA FY2026 Q3 10-Q discloses data-center compute/networking revenue, customer concentration, inventories, customer advances, data-center lease obligations, purchase-obligation/inventory charges, and supply-capacity risks: https://www.sec.gov/Archives/edgar/data/1045810/000104581025000230/nvda-20251026.htm'
        - 'AMD Q1 2026 official results disclose data-center segment revenue and the Meta 6 GW/first 1 GW Instinct deployment announcement as an official signal to track: https://ir.amd.com/news-events/press-releases/detail/1284/amd-reports-first-quarter-2026-financial-results'
        - Vast.ai documents API/CLI queryable marketplace pricing; Runpod, Lambda, Shadeform, and Fluidstack expose at least public pricing pages, with programmatic availability varying by provider.
        - 'TSMC publishes official monthly revenue and quarterly platform mix; Apr. 2026 monthly page shows 2026 monthly values, while Q1 management report gives HPC/platform share: https://investor.tsmc.com/english/monthly-revenue/2026 and https://investor.tsmc.com/english/quarterly-results/2026/q1'
        - Broadcom, Arista, Marvell/NVIDIA official releases provide clean AI networking/custom ASIC/optical signals, but they are broad deployment proxies rather than campus-capacity evidence.
      ranked_market_proxy_dataset_inventory:
        - '1 hyperscaler SEC/XBRL: capex, PP&E, depreciation/amortization, finance/operating leases, purchase commitments, cloud revenue. Clean quarterly/annual, highly programmatic, best support for spend-vs-capacity reconciliation; caveat: not AI-only and not campus-specific.'
        - '2 server vendor SEC/XBRL plus filing text for Dell, SMCI, HPE: inventories, receivables, deferred revenue, backlog/order commentary, AI server revenue where disclosed. Good quarterly absorption signal; caveat: backlog definitions vary and may be textual/non-XBRL.'
        - '3 NVIDIA/AMD official filings/results: data-center revenue split, customer concentration, inventory/customer advances, purchase obligations, networking vs compute, and announced deployment commitments. Strong chip-demand signal; caveat: sell-in and commitments do not prove utilization.'
        - '4 GPU rental price/availability: Vast API/CLI is strongest public programmatic route; Runpod/Lambda/Fluidstack/Shadeform public prices add cross-checks; Silicon Data offers paid indexed feeds. Good high-frequency demand/supply proxy; caveat: listing prices and availability do not equal utilization.'
        - '5 networking/custom ASIC/inference proxies: NVIDIA networking, Broadcom AI semiconductor/custom accelerator/Ethernet, Arista data-center networking, Marvell optical/custom silicon. Clean quarterly official data; useful for training-to-inference migration; caveat: no direct MW mapping.'
        - '6 TSMC monthly revenue plus quarterly HPC/advanced-node mix: excellent timely foundry demand proxy; caveat: broad customer mix and no public CoWoS allocation by customer.'
        - '7 HBM supplier disclosures: Micron/SK hynix/Samsung revenue/capex/contract commentary can flag tightness; caveat: public pricing and lead-time datasets are weak or paid.'
        - '8 CoWoS allocation cuts/pushouts: low-confidence unless confirmed by TSMC/customer filings; treat as labeled rumor overlay only.'
      fields_and_source_ideas:
        - 'SEC collector fields: cik, ticker, period, fiscal_year_quarter, tag, value, unit, form, filed_date, accession, frame, source_url.'
        - 'Hyperscaler tags: PaymentsToAcquirePropertyPlantAndEquipment, PropertyPlantAndEquipmentNet, DepreciationDepletionAndAmortization, OperatingLeaseRightOfUseAsset, FinanceLeaseRightOfUseAsset, PurchaseCommitmentAndContingentObligation, revenue segment tags where available.'
        - 'Server-vendor tags/text: InventoryNet, AccountsReceivableNetCurrent, ContractWithCustomerLiability, RemainingPerformanceObligationExpectedTimingOfSatisfaction, segment revenue, backlog/order commentary snippets with source offsets.'
        - 'GPU rental fields: provider, region, gpu_model, gpu_count, interconnect, vram, price_per_gpu_hour, availability_count, reserved/on_demand, timestamp, source_url/api_endpoint.'
        - 'TSMC fields: month, revenue_ntd_m, yoy_pct, quarter, platform_mix_pct, advanced_node_share_pct, capex_guidance_low/high if present.'
      caveats_and_confidence_tags:
        - 'High confidence: SEC/XBRL numeric accounting data and official quarterly/monthly company releases.'
        - 'Medium confidence: textual backlog/order commentary because definitions and customer readiness vary.'
        - 'Medium confidence: GPU rental pricing/availability because inventory on a marketplace may be stale, regional, or not representative of hyperscaler private capacity.'
        - 'Low confidence: HBM pricing/lead times and CoWoS pushouts unless sourced to official filings or paid datasets explicitly labeled as such.'
        - All proxy datasets must be linked to claims like spend, hardware shipment, or market absorption, not to direct campus energization unless paired with direct evidence from T002.
      suggested_collector_backlog:
        - Build EDGAR/XBRL collector for hyperscalers, Dell, SMCI, HPE, NVDA, AMD, AVGO, ANET, MRVL, MU and selected memory/networking suppliers.
        - Add filing-text extractor for backlog/order/customer concentration snippets with source URLs and filing offsets.
        - Add daily/weekly GPU rental price and availability snapshots starting with Vast API, then public Runpod/Lambda/Fluidstack/Shadeform pages where terms allow.
        - Add TSMC monthly revenue and quarterly platform-mix scraper from official investor pages/PDFs.
        - Create proxy_signal_definitions table/file mapping each proxy to what it validates, what it cannot validate, update frequency, and confidence.
      next: 'T004 should choose a first implementation slice. Recommended: direct campus_evidence matrix first, with proxy schema deferred or included only as a companion signal taxonomy.'
  - id: T004
    type: judge
    assignee: Judge
    status: done
    reasoning_hint: high
    objective: Choose the first data model and collection slice that best advances the 90% confidence capacity assessment.
    inputs:
      - T001 receipt
      - T002 receipt
      - T003 receipt
      - Original user outcome and stopping rule
    constraints:
      - Do not implement.
      - Prefer a small, reversible, verifiable Worker slice.
      - Require explicit allowed_files, verify commands, and stop_if conditions for the next Worker.
      - Reject any slice that mixes capacity definitions or increases double-counting risk.
    expected_output:
      - Decision
      - Canonical capacity/evidence taxonomy for the first tranche
      - Exact Worker objective for T005
      - allowed_files for T005
      - verify commands for T005
      - stop_if conditions for T005
      - Deferred/blocked tasks
    receipt:
      result: done
      decision: first_tranche_is_direct_campus_evidence_matrix
      summary: 'Selected a small reversible Worker slice: add a normalized campus_evidence data model and loader/validator support before collecting more data or adding market proxies. This directly supports the 90% confidence gate because every campus claim can be tied to independent evidence routes and capacity-definition-safe MW fields.'
      canonical_capacity_evidence_taxonomy:
        - 'capacity_definition must be explicit and non-interchangeable: Critical-IT, Facility-power, Contracted-load, Generation-nameplate, Backup-generation, Substation-capacity, Building-count, Unknown.'
        - 'evidence_type should describe the public record route: utility_service_agreement, commission_order, local_site_plan, building_permit, electrical_permit, certificate_of_occupancy, air_permit_backup_generation, onsite_generation_permit, substation_transmission, eia_generator_crosscheck, satellite_construction, corporate_activation, water_wastewater, tax_abatement, media_report, other.'
        - 'independence_group should support two-evidence gating: operator, utility, regulator, local_government, environmental_agency, grid_operator, federal_dataset, satellite, financial_filing, media, paid_dataset, other.'
        - 'claim_status should stay separate from campus.status: announced, approved, site_work, under_construction, energized_partial, energized_full, paused, cancelled, not_publicly_knowable.'
        - Any MW value must include mw_basis/capacity_definition and must not overwrite campus planned/phase/energized MW without a later explicit collection task.
      worker_objective_for_T005: Create the normalized campus_evidence schema, YAML data file, loader, and validations. Seed only an empty or minimal structurally valid rows list; do not collect evidence rows yet.
      allowed_files_for_T005:
        - schema.sql
        - scripts/load.py
        - scripts/validate.py
        - data/campus_evidence.yaml
      verify_commands_for_T005:
        - .venv/bin/python scripts/load.py
        - .venv/bin/python scripts/validate.py
        - sqlite3 data.db "PRAGMA table_info(campus_evidence); SELECT COUNT(*) AS campus_evidence_rows FROM campus_evidence;"
      stop_if_for_T005:
        - Need files outside allowed_files.
        - Need to collect/source new evidence rows before the schema is accepted.
        - Capacity definition, evidence type, or independence group taxonomy cannot be represented without mixing MW meanings.
        - Validation fails twice or load.py cannot rebuild data.db.
      deferred_or_blocked_tasks:
        - T006 collector choice deferred until campus_evidence model is validated.
        - Market proxy collectors deferred until direct evidence matrix exists; they should become companion confidence signals, not direct campus-status evidence.
        - International and site-TBD campus rows should be tagged but not used as first population targets unless a public docket/site route appears.
