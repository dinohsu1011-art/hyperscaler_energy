version: 2
goal:
  title: AI Capacity Reality Tracker
  slug: ai-capacity-reality-tracker
  kind: specific
  tranche: Evidence-saturation data acquisition and triangulation for real AI/data-center capacity ramp vs announcements.
  status: active
  intake:
    original_request: Figure out how much capacity is actually coming online, how fast it is building, and how that differs from announcements.
    interpreted_outcome: Build enough source-backed data and confidence scoring to assess real AI/data-center capacity ramp vs announcement narrative at roughly 90% confidence.
    input_shape: specific
    audience: Investor/operator using the hyperscaler energy dashboard
    authority: requested
    proof_type: artifact
    completion_proof: Each major assessment claim has at least two independent evidence types or an explicit not-publicly-knowable verdict, with residual uncertainty recorded.
    likely_misfire: Collecting broad AI/semi data or building UI polish before proving which evidence answers actual capacity coming online.
    blind_spots_considered:
      - 'Capacity definition ambiguity: announced MW, utility-approved MW, planned campus MW, energized MW, critical IT load, facility power, GPU/compute proxy, and market absorption proxy must not be mixed.'
      - Tenant/operator/campus/energy-contract double counting can make capacity look more real than it is.
      - Some evidence is proprietary; not-publicly-knowable must be a documented verdict, not an assumption.
      - Low-confidence HBM/CoWoS/channel-check rumors should not dominate the core proof standard.
      - The goal can research forever unless completion is gated by a confidence matrix.
    existing_plan_facts:
      - Use a confidence-gated evidence matrix as the stopping rule.
      - Include all direct capacity evidence plus supporting market proxies.
      - Core proof should prioritize direct capacity evidence and clean public datasets; low-confidence rumors are optional overlays only.
      - Preliminary ranking found cleanest public datasets are SEC/XBRL accounting signals, server inventory/backlog/receivables, Nvidia/AMD commitments/customer concentration, GPU cloud rental/availability, ASIC/networking inference proxies, TSMC monthly/HPC mix, then HBM/CoWoS rumor overlays.
      - May 14 refocus: prioritize primary-source buildout-capacity disclosures from hyperscalers, neoclouds, colocation/data-center operators, and AI infrastructure companies, especially earnings-call transcripts, investor-day transcripts, CEO/CFO interviews, company blogs, official presentations, SEC filing text, and press releases where management states current active capacity, live clusters, capacity delivered, capacity under construction, deployment timing, utilization, backlog conversion, or buildout constraints.
rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
agents:
  scout: installed
  worker: installed
  judge: installed
visual_board:
  selected: local
  local:
    status: live
    url: http://goalbuddy.localhost:41737/ai-capacity-reality-tracker/
    command: npx goalbuddy board /Users/dinohsu/Documents/GitHub/hyperscaler_energy/docs/goals/ai-capacity-reality-tracker
